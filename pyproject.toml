[project]
name = "leadgen"
version = "0.1.0"
description = "Venue lead discovery and extraction for MatchUp (Ankara pilot)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
leadgen = "leadgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
